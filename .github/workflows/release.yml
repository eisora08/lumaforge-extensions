name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package zip
        run: |
          ver=$(node -p "require('./extensions/steam-store-helper/manifest.json').version")
          mkdir -p stage
          cp extensions/steam-store-helper/manifest.json \
             extensions/steam-store-helper/inject.js \
             extensions/steam-store-helper/backend.lua \
             extensions/steam-store-helper/extension.lua \
             extensions/steam-store-helper/extension-config.json \
             stage/
          (cd stage && zip -r "../steam-store-helper-$ver.zip" .)
          echo "Packaged steam-store-helper-$ver.zip"

      # Auto-generated notes only list commits when PRs exist, so build the
      # "What's Changed" list straight from git log.
      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          {
            echo 'See the assets for download links.'
            echo
            if [ -n "$prev" ]; then
              echo "## What's Changed"
              git log --no-merges --pretty='- `%h` %s' "${prev}..${tag}"
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
            fi
          } > release-notes.md

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: steam-store-helper-*.zip
          name: steam-store-helper ${{ github.ref_name }}
          body_path: release-notes.md
